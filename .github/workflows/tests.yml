name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 and 3.10 are supported and tested locally, but hosted runners no longer ship them.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . && (pip install "anthropic>=2.9" || true)
      - run: python -m unittest discover -s tests -v
      - run: ebf --version
