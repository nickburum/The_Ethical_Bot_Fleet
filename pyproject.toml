[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ethical-bot-fleet"
dynamic = ["version"]
description = "Crawlers and AI agents that behave themselves: robots.txt (RFC 9309), AI opt-out signals, per-host politeness, honest identity and a tamper-evident audit log. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["crawler", "scraper", "robots.txt", "ai-agents", "bots", "rate-limiting", "rfc9309", "ethics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/nickburum/The_Ethical_Bot_Fleet"
Issues = "https://github.com/nickburum/The_Ethical_Bot_Fleet/issues"

[project.scripts]
ebf = "ethical_bot_fleet.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ethical_bot_fleet.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
